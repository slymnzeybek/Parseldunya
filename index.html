<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parseldunya | Dijital Dünya</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02060d;
    color:white;
    font-family:Arial,sans-serif;
}

#app{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* ÜST MENÜ */

.top{
    position:fixed;
    z-index:10;
    top:0;
    left:0;
    right:0;
    height:75px;
    padding:0 25px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(
            #02060de8,
            transparent
        );

    pointer-events:none;
}

.logo{
    font-size:25px;
    font-weight:900;
    pointer-events:auto;
}

.logo span{
    color:#35dcff;
}

.menu{
    pointer-events:auto;
}

.menu a{
    display:inline-block;
    padding:12px 18px;

    border-radius:12px;

    background:#35dcff;
    color:#031018;

    text-decoration:none;
    font-weight:800;
}

/* ALT BİLGİ */

.info{
    position:fixed;
    z-index:10;

    left:22px;
    bottom:22px;

    width:390px;
    max-width:calc(100% - 44px);

    padding:20px;

    border-radius:20px;

    background:#071321e8;
    border:1px solid #ffffff18;

    backdrop-filter:blur(16px);
}

.info h1{
    margin:0 0 8px;
    font-size:24px;
}

.info p{
    margin:0;
    color:#9baabd;
    line-height:1.55;
}

.stats{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.stat{
    flex:1;
    padding:11px;

    border-radius:12px;

    background:#ffffff08;
}

.stat strong{
    display:block;
    font-size:19px;
}

.stat small{
    color:#77889e;
}

/* KONTROL */

.help{
    position:fixed;
    z-index:10;

    right:22px;
    bottom:22px;

    padding:12px 15px;

    border-radius:12px;

    background:#071321dd;

    color:#94a4b8;

    font-size:12px;
}

/* PARSEL BİLGİ */

.parcel-card{
    position:fixed;
    z-index:20;

    display:none;

    top:95px;
    right:22px;

    width:310px;
    max-width:calc(100% - 44px);

    padding:20px;

    border-radius:18px;

    background:#071321f5;
    border:1px solid #35dcff55;

    backdrop-filter:blur(16px);
}

.parcel-card.active{
    display:block;
}

.parcel-card h2{
    margin:0 0 8px;
}

.parcel-card p{
    color:#9baabd;
    line-height:1.5;
}

.close{
    float:right;

    background:none;
    border:0;

    color:white;

    font-size:24px;

    cursor:pointer;
}

.parcel-link{
    display:block;

    text-align:center;

    padding:12px;

    border-radius:11px;

    background:#35dcff;

    color:#031018;

    text-decoration:none;

    font-weight:800;
}

/* LEJANT */

.legend{
    position:fixed;
    z-index:10;

    top:90px;
    left:22px;

    padding:12px 15px;

    border-radius:13px;

    background:#071321dd;

    color:#9baabd;

    font-size:12px;
}

.dot{
    display:inline-block;

    width:8px;
    height:8px;

    margin-right:5px;

    border-radius:50%;
}

.free{
    background:#35dcff;
}

.premium{
    background:#ffd34d;
}

.owned{
    background:#50e58a;
}


/* MOBİL */

@media(max-width:650px){

    .top{
        height:65px;
        padding:0 14px;
    }

    .logo{
        font-size:20px;
    }

    .legend{
        top:75px;
        left:12px;
    }

    .help{
        display:none;
    }

    .info{
        left:12px;
        right:12px;
        bottom:12px;

        width:auto;
        max-width:none;
    }

    .parcel-card{
        top:auto;
        right:12px;
        left:12px;
        bottom:12px;
        width:auto;
        max-width:none;
    }
}
</style>
</head>


<body>

<div id="app"></div>


<!-- ÜST MENÜ -->

<div class="top">

    <div class="logo">
        Parsel<span>dunya</span>
    </div>

    <div class="menu">

        <a href="parseller.html">
            Parseller
        </a>

    </div>

</div>


<!-- LEJANT -->

<div class="legend">

    <span>
        <i class="dot free"></i>
        Müsait
    </span>

    &nbsp;&nbsp;

    <span>
        <i class="dot premium"></i>
        Premium
    </span>

    &nbsp;&nbsp;

    <span>
        <i class="dot owned"></i>
        Sahipli
    </span>

</div>


<!-- BİLGİ -->

<div class="info">

    <h1>
        🌍 10.000 Parsellik Dijital Dünya
    </h1>

    <p>
        Dünyayı mouse ile çevir,
        yakınlaştır ve üzerindeki
        dijital parselleri keşfet.
    </p>

    <div class="stats">

        <div class="stat">
            <strong>10.000</strong>
            <small>Toplam</small>
        </div>

        <div class="stat">
            <strong>9.990</strong>
            <small>Müsait</small>
        </div>

        <div class="stat">
            <strong>10</strong>
            <small>Sahipli</small>
        </div>

    </div>

</div>


<div class="help">
    🖱️ Sürükle: Döndür
    &nbsp; • &nbsp;
    🔍 Tekerlek: Yakınlaştır
</div>


<!-- PARSEL KARTI -->

<div
    id="parcelCard"
    class="parcel-card">

    <button
        class="close"
        onclick="closeParcel()">

        ×

    </button>

    <h2 id="parcelTitle">
        Parsel #1
    </h2>

    <p id="parcelDescription"></p>

    <a
        class="parcel-link"
        href="parseller.html">

        Parselleri Gör

    </a>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================
   SAHNE
===================================== */

const app =
    document.getElementById("app");


const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        42,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );


camera.position.z = 3;


/* =====================================
   RENDER
===================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


app.appendChild(
    renderer.domElement
);


/* =====================================
   IŞIK
===================================== */

const ambient =
    new THREE.AmbientLight(
        0x9cc7df,
        1.2
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

sun.position.set(
    5,
    3,
    5
);

scene.add(sun);


/* =====================================
   DÜNYA GRUBU
===================================== */

const earthGroup =
    new THREE.Group();

scene.add(
    earthGroup
);


/* =====================================
   DÜNYA
===================================== */

const earthGeometry =
    new THREE.SphereGeometry(
        1,
        96,
        96
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({

        color:0x126d91,

        shininess:20,

        specular:0x234f6c

    });


const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );


earthGroup.add(
    earth
);


/* =====================================
   ATMOSFER
===================================== */

const atmosphereGeometry =
    new THREE.SphereGeometry(
        1.045,
        64,
        64
    );


const atmosphereMaterial =
    new THREE.MeshBasicMaterial({

        color:0x35dcff,

        transparent:true,

        opacity:.09,

        side:THREE.BackSide

    });


const atmosphere =
    new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
    );


earthGroup.add(
    atmosphere
);


/* =====================================
   KITALAR
===================================== */

const landGroup =
    new THREE.Group();


earthGroup.add(
    landGroup
);


const landMaterial =
    new THREE.MeshPhongMaterial({

        color:0x268d5d,

        shininess:5

    });


function createLand(
    latitude,
    longitude,
    scaleX,
    scaleY,
    scaleZ
){

    const phi =
        (90 - latitude)
        * Math.PI / 180;

    const theta =
        (longitude + 90)
        * Math.PI / 180;


    const x =
        Math.sin(phi)
        * Math.cos(theta);


    const y =
        Math.cos(phi);


    const z =
        Math.sin(phi)
        * Math.sin(theta);


    const geometry =
        new THREE.SphereGeometry(
            1,
            20,
            12
        );


    const land =
        new THREE.Mesh(
            geometry,
            landMaterial
        );


    land.scale.set(
        scaleX,
        scaleY,
        scaleZ
    );


    land.position.set(
        x * 1.005,
        y * 1.005,
        z * 1.005
    );


    land.lookAt(
        0,
        0,
        0
    );


    landGroup.add(
        land
    );
}


/*
   Stilize kıta şekilleri.
*/

createLand(45,-100,.28,.08,.18);
createLand(30,-90,.30,.10,.18);
createLand(15,-75,.15,.08,.30);

createLand(45,10,.38,.10,.18);
createLand(25,20,.28,.09,.22);
createLand(0,20,.18,.08,.28);

createLand(50,100,.42,.10,.20);
createLand(30,120,.28,.08,.18);
createLand(-25,135,.18,.07,.20);

createLand(-25,25,.18,.08,.23);


/* =====================================
   PARSELLER
===================================== */

const TOTAL_PARCELS =
    10000;


const parcelGeometry =
    new THREE.SphereGeometry(
        .0105,
        6,
        6
    );


const parcelMaterial =
    new THREE.MeshBasicMaterial({
        color:0x35dcff
    });


/*
   InstancedMesh:
   10.000 parseli tek obje
   olarak çizerek performansı artırır.
*/

const parcels =
    new THREE.InstancedMesh(
        parcelGeometry,
        parcelMaterial,
        TOTAL_PARCELS
    );


earthGroup.add(
    parcels
);


const dummy =
    new THREE.Object3D();


const color =
    new THREE.Color();


const premiumParcels =
    new Set([
        1,2,3,4,5,
        10,11,12,
        20,21
    ]);


const ownedParcels =
    new Set([
        17,
        48,
        126,
        321,
        777,
        1024,
        2500,
        5000,
        7777,
        9999
    ]);


/*
   Fibonacci dağılımı.
   Parseller küreye dengeli dağılır.
*/

for(
    let i = 0;
    i < TOTAL_PARCELS;
    i++
){

    const phi =
        Math.acos(
            -1 +
            (2 * (i + .5))
            / TOTAL_PARCELS
        );


    const theta =
        Math.PI *
        (1 + Math.sqrt(5))
        * (i + .5);


    const x =
        Math.sin(phi)
        * Math.cos(theta);


    const y =
        Math.cos(phi);


    const z =
        Math.sin(phi)
        * Math.sin(theta);


    dummy.position.set(
        x * 1.018,
        y * 1.018,
        z * 1.018
    );


    dummy.lookAt(
        x * 2,
        y * 2,
        z * 2
    );


    dummy.updateMatrix();


    parcels.setMatrixAt(
        i,
        dummy.matrix
    );


    if(
        premiumParcels.has(i + 1)
    ){

        color.set(
            0xffd34d
        );

    }
    else if(
        ownedParcels.has(i + 1)
    ){

        color.set(
            0x50e58a
        );

    }
    else{

        color.set(
            0x35dcff
        );

    }


    parcels.setColorAt(
        i,
        color
    );
}


parcels.instanceMatrix.needsUpdate =
    true;

parcels.instanceColor.needsUpdate =
    true;


/* =====================================
   MOUSE / TOUCH
===================================== */

let dragging =
    false;

let lastX =
    0;

let lastY =
    0;

let movement =
    0;


renderer.domElement.addEventListener(
    "pointerdown",
    function(event){

        dragging = true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        movement = 0;

    }
);


window.addEventListener(
    "pointermove",
    function(event){

        if(!dragging)
            return;


        const dx =
            event.clientX -
            lastX;


        const dy =
            event.clientY -
            lastY;


        earthGroup.rotation.y +=
            dx * .005;


        earthGroup.rotation.x +=
            dy * .003;


        earthGroup.rotation.x =
            Math.max(
                -1.3,
                Math.min(
                    1.3,
                    earthGroup.rotation.x
                )
            );


        lastX =
            event.clientX;

        lastY =
            event.clientY;


        movement +=
            Math.abs(dx) +
            Math.abs(dy);

    }
);


window.addEventListener(
    "pointerup",
    function(){

        dragging = false;

    }
);


/* =====================================
   ZOOM
===================================== */

renderer.domElement.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();


        camera.position.z +=
            event.deltaY * .0015;


        camera.position.z =
            Math.max(
                1.55,
                Math.min(
                    5.5,
                    camera.position.z
                )
            );

    },
    {
        passive:false
    }
);


/* =====================================
   PARSEL TIKLAMA
===================================== */

const raycaster =
    new THREE.Raycaster();


const mouse =
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "click",
    function(event){

        if(
            movement > 8
        )
            return;


        mouse.x =
            event.clientX /
            window.innerWidth *
            2 - 1;


        mouse.y =
            -(
                event.clientY /
                window.innerHeight
            ) * 2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits =
            raycaster.intersectObject(
                parcels
            );


        if(
            hits.length === 0
        )
            return;


        const instanceId =
            hits[0].instanceId;


        if(
            instanceId === undefined
        )
            return;


        const id =
            instanceId + 1;


        showParcel(
            id
        );

    }
);


/* =====================================
   PARSEL BİLGİ
===================================== */

function showParcel(
    id
){

    const title =
        document.getElementById(
            "parcelTitle"
        );


    const description =
        document.getElementById(
            "parcelDescription"
        );


    title.textContent =
        "Parsel #" + id;


    if(
        premiumParcels.has(id)
    ){

        description.textContent =
            "⭐ Bu premium parseldir.";

    }
    else if(
        ownedParcels.has(id)
    ){

        description.textContent =
            "🟢 Bu parsel şu anda sahipli.";

    }
    else{

        description.textContent =
            "🔵 Bu parsel müsait.";

    }


    document
        .getElementById(
            "parcelCard"
        )
        .classList.add(
            "active"
        );
}


function closeParcel(){

    document
        .getElementById(
            "parcelCard"
        )
        .classList.remove(
            "active"
        );

}


/* =====================================
   EKRAN BOYUTU
===================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================
   ANİMASYON
===================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
