<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parseldunya</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020617;
}

canvas{
    display:block;
}
</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020617);


const camera = new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.1,
100
);

camera.position.z = 3;


const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

document.body.appendChild(renderer.domElement);


/* IŞIK */

const ambient = new THREE.AmbientLight(
0xffffff,
1
);

scene.add(ambient);


const sun = new THREE.DirectionalLight(
0xffffff,
3
);

sun.position.set(5,3,5);

scene.add(sun);


/* DÜNYA */

const geometry = new THREE.SphereGeometry(
1,
128,
128
);


const material = new THREE.MeshPhongMaterial({
color:0x1683c4
});


const earth = new THREE.Mesh(
geometry,
material
);

scene.add(earth);


/* KITALAR */

const landMaterial =
new THREE.MeshBasicMaterial({
color:0x35a85b
});


function land(
lat,
lon,
scaleX,
scaleY
){

const phi =
(90-lat)*Math.PI/180;

const theta =
(lon+180)*Math.PI/180;

const x =
Math.sin(phi)*Math.cos(theta);

const y =
Math.cos(phi);

const z =
Math.sin(phi)*Math.sin(theta);


const land =
new THREE.Mesh(

new THREE.SphereGeometry(
0.15,
32,
32
),

landMaterial

);


land.position.set(
x,
y,
z
);

land.scale.set(
scaleX,
scaleY,
.3
);

land.lookAt(0,0,0);

scene.add(land);

}


/* KABA KITA KÜTLELERİ */

land(40,0,2.2,1.4);
land(10,-55,1.7,2.0);
land(-20,20,1.3,1.5);
land(5,110,2.0,1.3);
land(-25,135,1.3,1);


/* ATMOSFER */

const atmosphere =
new THREE.Mesh(

new THREE.SphereGeometry(
1.08,
64,
64
),

new THREE.MeshBasicMaterial({
color:0x35c9ff,
transparent:true,
opacity:.12,
side:THREE.BackSide
})

);

scene.add(atmosphere);


/* YILDIZLAR */

const stars =
new THREE.BufferGeometry();

const positions=[];

for(let i=0;i<3000;i++){

const r=20+Math.random()*20;

const a=Math.random()*Math.PI*2;

const b=Math.random()*Math.PI;

positions.push(
r*Math.sin(b)*Math.cos(a),
r*Math.cos(b),
r*Math.sin(b)*Math.sin(a)
);

}

stars.setAttribute(
"position",
new THREE.Float32BufferAttribute(
positions,
3
)
);

scene.add(

new THREE.Points(

stars,

new THREE.PointsMaterial({
color:0xffffff,
size:.05
})

)

);


/* MOUSE */

let down=false;
let lastX=0;

renderer.domElement.addEventListener(
"pointerdown",
e=>{
down=true;
lastX=e.clientX;
}
);

window.addEventListener(
"pointerup",
()=>{
down=false;
}
);

window.addEventListener(
"pointermove",
e=>{

if(!down)return;

earth.rotation.y +=
(e.clientX-lastX)*.005;

lastX=e.clientX;

}
);


/* ANİMASYON */

function animate(){

requestAnimationFrame(animate);

earth.rotation.y += .0005;

renderer.render(
scene,
camera
);

}

animate();


/* EKRAN */

window.addEventListener(
"resize",
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
